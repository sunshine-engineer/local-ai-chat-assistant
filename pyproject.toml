# File: pyproject.toml
# Purpose: Shared Python formatting, lint and docstring conventions.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".assistant", ".venv", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D205", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
