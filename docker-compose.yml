# File: docker-compose.yml
# Purpose: Run local Ollama, PostgreSQL and app services with bounded mounts and configurable host settings.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ${OLLAMA_CONTAINER_NAME:-ollama}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  chatbot:
    build: .
    container_name: ${CHATBOT_CONTAINER_NAME:-qa-chatbot}
    restart: unless-stopped
    command:
      - sh
      - -c
      - python -m postgres.initialize && exec streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CHATBOT_PORT:-8501}:8501"
    env_file:
      - .env
    volumes:
      - ./.assistant:/app/.assistant
      - type: bind
        source: ${ASSISTANT_EVIDENCE_DIR:-./examples}
        target: /evidence
        read_only: true
        bind:
          create_host_path: false
    environment:
      # URL.create in postgres/db.py safely encodes customized credentials.
      DATABASE_URL: ""
      OLLAMA_HOST: http://ollama:11434
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-chatbot}
      DB_USER: ${POSTGRES_USER:-chatbot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-chatbot}

  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      retries: 5

volumes:
  ollama-data:
  postgres-data:
